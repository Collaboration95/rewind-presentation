<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rewind SAD diagram review</title><style>*{box-sizing:border-box}body{margin:0;color:var(--foreground,#14202b);font:16px var(--font-sans,Helvetica,Arial,sans-serif)}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}select,button{font:inherit;padding:8px 12px;border:1px solid var(--border,#c7bca7);border-radius:8px;color:inherit;background:var(--card,#fff)}select{flex:1;min-width:220px}.figure{background:#fff;border:1px solid var(--border,#c7bca7);border-radius:12px;padding:16px;overflow:auto;max-height:760px}.figure img{display:block;width:100%;height:auto;margin:auto}.figure.full img{width:auto;max-width:none}p{color:var(--muted-foreground,#596473);line-height:1.5;margin:10px 0}code{font-family:var(--font-mono,monospace);font-size:14px}</style><div class="tools"><button id="prev" aria-label="Previous figure">←</button><select id="choose" aria-label="Choose diagram"></select><button id="next" aria-label="Next figure">→</button><button id="size" aria-pressed="false">Full size</button></div><div class="figure" id="frame"><img id="image" alt=""></div><p id="caption"></p><script>const names=["uc-model", "arch-logical", "bce-cycle", "a2d-cycle", "class-cycle", "seq-cycle", "state-cycle", "seq-capture", "uc-model-access", "uc-model-capture", "uc-model-cycle", "seq-cycle-compile", "seq-cycle-release", "seq-capture-accept", "seq-capture-commit", "seq-capture-process"];const paths=["/Users/speedpowermac/Documents/projects/CODE_MAIN/NUS/SWE5006/presentation-prep/deck/uml/uc-model.png", "/Users/speedpowermac/Documents/projects/CODE_MAIN/NUS/SWE5006/presentation-prep/deck/uml/arch-logical.png", "/Users/speedpowermac/Documents/projects/CODE_MAIN/NUS/SWE5006/presentation-prep/deck/uml/bce-cycle.png", "/Users/speedpowermac/Documents/projects/CODE_MAIN/NUS/SWE5006/presentation-prep/deck/uml/a2d-cycle.png", "/Users/speedpowerma
