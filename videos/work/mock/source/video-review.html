html, body { height: 100%; min-height: 100dvh; width: 100%; margin: 0px; background: rgb(246, 237, 227); }
html, body, #root { overflow: clip; }
body { overscroll-behavior: none; }
:focus-visible { outline: rgb(61, 123, 217) solid 2px; outline-offset: 3px; }
#root { display: flex; height: 100%; min-height: 100dvh; flex: 1 1 0%; background: rgb(246, 237, 227); }
html [data-rw~="glass"] { isolation: isolate; background: linear-gradient(170deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.1)); backdrop-filter: blur(12px) saturate(190%) brightness(1.04); box-shadow: rgba(255, 255, 255, 0.95) 0px 1px 1px inset, rgba(255, 255, 255, 0.4) 0px -1px 1px inset, rgba(255, 255, 255, 0.22) 0px 0px 20px inset, rgba(160, 90, 40, 0.35) 0px 18px 36px -16px, rgba(160, 90, 40, 0.14) 0px 2px 6px -2px; }
html [data-rw~="glass"]::before { content: ""; position: absolute; inset: 0px; z-index: -1; border-radius: inherit; pointer-events: none; background: radial-gradient(120% 70% at 16% -12%, rgba(255, 255, 255, 0.8), transparent 46%), linear-gradient(118deg, transparent 58%, rgba(255, 255, 255, 0.2) 64%, transparent 72%); }
html [data-rw~="glass"]::after { content: ""; position: absolute; inset: 0px; padding: 1.3px; border-radius: inherit; pointer-events: none; background: linear-gradient(135deg, rgb(255, 255, 255), rgba(255, 255, 255, 0.25) 30%, rgba(255, 255, 255, 0.06) 52%, rgba(255, 255, 255, 0.35) 76%, rgba(255, 255, 255, 0.95)); mask: linear-gradient(rgb(0, 0, 0) 0px, rgb(0, 0, 0) 0px) content-box exclude, linear-gradient(rgb(0, 0, 0) 0px, rgb(0, 0, 0) 0px); }
html [data-rw~="menu"] { background: linear-gradient(170deg, rgba(255, 251, 246, 0.94), rgba(255, 246, 236, 0.84)); }
html [data-rw~="dialog"] { background: rgba(255, 250, 244, 0.92); }
html [data-rw~="sheet"] { background: rgba(255, 250, 244, 0.88); }
html [data-rw~="composer"] { background: linear-gradient(170deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.5)); }
html [data-rw~="composer"]:focus-within { box-shadow: rgb(255, 255, 255) 0px 1px 1px inset, rgba(224, 112, 58, 0.6) 0px 0px 0px 2px, rgba(160, 90, 40, 0.4) 0px 14px 30px -16px; }
html [data-rw~="lens"] { background: linear-gradient(rgba(255, 255, 255, 0.62), rgba(255, 255, 255, 0.28)); box-shadow: rgb(255, 255, 255) 0px 1px 1px inset, rgba(150, 80, 30, 0.28) 0px 3px 10px -3px; }
html [data-rw~="btn"] { background: rgba(255, 255, 255, 0.6); box-shadow: rgb(255, 255, 255) 0px 1px 1px inset, rgba(255, 255, 255, 0.8) 0px 0px 0px 1px inset, rgba(150, 80, 30, 0.4) 0px 6px 16px -10px; }
html [data-rw~="primary"] { background: linear-gradient(rgb(255, 210, 166), rgb(255, 159, 107)); box-shadow: rgba(224, 112, 58, 0.8) 0px 10px 22px -12px; }
html [data-rw~="danger"] { background: rgb(194, 69, 47); box-shadow: none; }
html [data-rw~="soft"] { background: rgba(255, 255, 255, 0.55); box-shadow: rgba(255, 255, 255, 0.9) 0px 0px 0px 1px inset, rgba(150, 80, 30, 0.25) 0px 4px 12px -4px; backdrop-filter: blur(10px); }
html [data-rw~="pill"] { background: rgba(255, 255, 255, 0.7); box-shadow: rgb(255, 255, 255) 0px 1px 1px inset, rgba(255, 255, 255, 0.8) 0px 0px 0px 1px inset, rgba(150, 80, 30, 0.4) 0px 4px 10px -6px; }
html [data-rw~="dark-glass"] { background: rgba(255, 255, 255, 0.14); backdrop-filter: blur(16px) saturate(160%); box-shadow: rgba(255, 255, 255, 0.3) 0px 1px 1px inset, rgba(255, 255, 255, 0.12) 0px 0px 0px 1px inset; }
html [data-rw~="dark-pill"] { background: rgba(0, 0, 0, 0.28); backdrop-filter: blur(16px); }
html [data-rw~="dim"] { background: rgba(40, 24, 14, 0.32); backdrop-filter: blur(3px); }
html [data-rw~="sealed-veil"] { background: rgba(20, 12, 8, 0.4); backdrop-filter: blur(18px); }
html [data-rw~="chat-head"] { background: rgba(246, 237, 227, 0.78); backdrop-filter: blur(16px) saturate(140%); mask-image: linear-gradient(rgb(0, 0, 0) 80%, transparent); }
html [data-rw~="core"] { background: radial-gradient(circle at 35% 30%, rgb(255, 225, 184), rgb(255, 167, 102) 50%, rgb(234, 111, 69)); box-shadow: rgba(234, 111, 69, 0.55) 0px 10px 28px -6px; }
html [data-rw~="core"][data-off="true"] { filter: grayscale(0.9); opacity: 0.45; box-shadow: none; }
html [data-rw~="pills-on"] { background: linear-gradient(90deg, rgb(246, 161, 91), rgb(232, 112, 74)); }
html [data-rw~="own-bubble"] { background: linear-gradient(rgb(255, 220, 188), rgb(255, 191, 148)); }
html [data-rw~="upbar"] { background: linear-gradient(90deg, rgb(255, 210, 166), rgb(255, 159, 107)); }
html [data-rw~="fade-top"] { background: linear-gradient(rgb(246, 237, 227) 55%, transparent); }
html [data-rw~="fade-bottom"] { background: linear-gradient(transparent, rgb(246, 237, 227) 78%); }
html [data-rw~="glow"] { filter: blur(40px); pointer-events: none; }
html [data-rw~="glow"] > div { position: absolute; inset: 0px; border-radius: 50%; }
html [data-rw~="glow"] > div:nth-child(1) { background: radial-gradient(circle at 50% 42%, rgb(255, 207, 150) 0px, rgba(255, 168, 110, 0.85) 15%, transparent 38%); animation: 10s ease-in-out 0s infinite normal none running rw-drift; }
html [data-rw~="glow"] > div:nth-child(2) { background: radial-gradient(circle at 40% 52%, rgba(255, 138, 118, 0.6) 0px, transparent 30%); animation: 12s ease-in-out -4s infinite reverse none running rw-drift; }
html [data-rw~="glow"] > div:nth-child(3) { background: radial-gradient(circle at 62% 38%, rgba(255, 214, 120, 0.75) 0px, transparent 28%); animation: 14s ease-in-out -7s infinite normal none running rw-drift; }
html [data-rw~="glow-low"] { background: radial-gradient(60% 45% at 28% 78%, rgba(255, 160, 110, 0.55), transparent 70%), radial-gradient(50% 40% at 78% 58%, rgba(255, 210, 140, 0.55), transparent 70%); filter: blur(24px); pointer-events: none; }
html [data-rw~="viewfinder"] { background: radial-gradient(120% 80% at 50% 32%, rgb(61, 38, 25), rgb(18, 11, 8) 70%); }
html [data-rw~="bokeh"] { opacity: 0.75; filter: blur(18px); mix-blend-mode: screen; transform: translate(-50%, -50%); animation: 9s ease-in-out 0s infinite alternate none running rw-bokeh; }
html [data-rw~="film-end"] { background: radial-gradient(circle at 50% 36%, rgba(255, 160, 100, 0.38), transparent 58%), rgb(18, 11, 8); }
html [data-rw~="mo-glow"] { background: radial-gradient(circle, rgb(242, 176, 143) 0px, rgba(224, 112, 58, 0.45) 38%, transparent 70%); filter: blur(6px); animation: 3.2s ease-in-out 0s infinite normal none running rw-breathe; }
html [data-rw~="mo-core"] { background: radial-gradient(circle, rgb(255, 255, 255) 0px, rgb(241, 180, 149) 70%); box-shadow: rgba(224, 112, 58, 0.7) 0px 0px 30px; }
html [data-rw~="muted-motif"] { opacity: 0.35; filter: grayscale(0.6); }
html [data-rw~="clip"] { overflow: clip; }
html [data-rw~="push"] { animation: 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) 0s 1 normal both running rw-push; }
html [data-rw~="menu-in"] { transform-origin: 50% 0px; animation: 0.22s cubic-bezier(0.2, 0.8, 0.2, 1) 0s 1 normal both running rw-menu; }
html [data-rw~="dlg-in"] { animation: 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) 0s 1 normal both running rw-up; }
html [data-rw~="fade-in"] { animation: 0.3s ease 0s 1 normal both running rw-fade; }
html [data-rw~="now-in"] { animation: 0.5s ease 0s 1 normal both running rw-now; }
html [data-rw~="card-in"] { animation: 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0s 1 normal both running rw-card; }
html [data-rw~="roll"] { animation: 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0s 1 normal none running rw-roll; }
html [data-rw~="nope"] { animation: 0.42s ease 0s 1 normal none running rw-nope; }
html [data-rw~="tip"] { animation: 1.9s ease 0s 1 normal both running rw-tip; }
html [data-rw~="toast"] { animation: 2.6s ease 0s 1 normal both running rw-toast; }
html [data-rw~="spin"] { animation: 0.9s linear 0s infinite normal none running rw-spin; }
html [data-rw~="slide"] { animation: 1.8s ease-in-out 0s infinite normal none running rw-slide; }
html [data-rw~="slide"][data-slow="true"] { animation-duration: 3.6s; opacity: 0.6; }
html [data-rw~="blink"] { animation: 1s steps(2) 0s infinite normal none running rw-blink; }
html [data-rw~="flash"] { animation: 0.45s ease-out 0s 1 normal both running rw-flash; }
html [data-rw~="launch-out"] { animation: 0.5s ease 0s 1 normal both running rw-launch; }
html [data-rw~="late-in"] { animation: 0.4s ease 2s 1 normal both running rw-fade; }
html [data-rw~="fill"] { transition: width 0.1s linear; }
@keyframes rw-drift { 
  0%, 100% { transform: translate(0px, 0px) scale(1); }
  50% { transform: translate(16px, -20px) scale(1.08); }
}
@keyframes rw-bokeh { 
  100% { opacity: 0.95; transform: translate(-44%, -56%) scale(1.12); }
}
@keyframes rw-breathe { 
  0%, 100% { transform: scale(0.94); }
  50% { transform: scale(1.08); }
}
@keyframes rw-push { 
  0% { opacity: 0; transform: translateX(28px); }
}
@keyframes rw-menu { 
  0% { opacity: 0; transform: translateY(-6px) scale(0.95); }
}
@keyframes rw-up { 
  0% { opacity: 0; transform: translateY(16px); }
}
@keyframes rw-fade { 
  0% { opacity: 0; }
}
@keyframes rw-now { 
  0% { opacity: 0; transform: translateY(6px); }
}
@keyframes rw-card { 
  0% { opacity: 0; transform: translateY(-10px) scale(0.98); }
}
@keyframes rw-roll { 
  0% { transform: translateY(45%); opacity: 0; }
}
@keyframes rw-nope { 
  20% { transform: translateX(-5px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(3px); }
}
@keyframes rw-tip { 
  0% { opacity: 0; transform: translateY(4px); }
  12%, 80% { opacity: 1; transform: none; }
  100% { opacity: 0; }
}
@keyframes rw-toast { 
  0% { opacity: 0; transform: translateY(8px); }
  8%, 88% { opacity: 1; transform: none; }
  100% { opacity: 0; }
}
@keyframes rw-spin { 
  100% { transform: rotate(360deg); }
}
@keyframes rw-slide { 
  0% { transform: translateX(-110%); }
  100% { transform: translateX(290%); }
}
@keyframes rw-blink { 
  50% { opacity: 0.2; }
}
@keyframes rw-flash { 
  0% { opacity: 0.85; }
  100% { opacity: 0; }
}
@keyframes rw-launch {
