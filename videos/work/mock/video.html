<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Rewind</title><style>
html,body{margin:0;padding:0;background:#120b08;overflow:hidden;-webkit-text-size-adjust:100%;touch-action:manipulation}#stage{position:fixed;left:0;top:0;width:402px;height:714px;transform-origin:0 0;overflow:hidden;background:#120b08}.state{position:absolute;inset:0;width:402px;height:714px;margin:0;padding:0;border:0;opacity:0;pointer-events:none}.state.active{opacity:1;pointer-events:auto}.still{display:block;object-fit:fill}#flash{position:absolute;inset:0;pointer-events:none;background:white;opacity:0;z-index:9}#flash.on{animation:flash .45s ease-out both}@keyframes flash{0%{opacity:.92}100%{opacity:0}}#seal-hotspot{position:absolute;left:176px;top:622px;width:204px;height:56px;background:transparent;border:0;z-index:10;display:none;padding:0}
</style></head><body><main id="stage" aria-label="Rewind camera"><iframe class="state" id="state-0" src="source/video-live.html" title="live" allow="autoplay" loading="eager" style="background:url('states/video-live.png') center/100% 100%"></iframe><iframe class="state" id="state-1" src="source/video-recording.html" title="recording" allow="autoplay" loading="eager" style="background:url('states/video-recording.png') center/100% 100%"></iframe><img class="state still" id="state-2" src="states/video-review-ready.png" alt="review"><img class="state still" id="state-3" src="states/video-applying-look.png" alt="applying"><img class="state still" id="state-4" src="states/video-sealed.png" alt="sealed"><img class="state still" id="state-5" src="states/video-ledger.png" alt="ledger"><div id="flash"></div><button id="seal-hotspot" aria-label="Seal"></button></main><script>
(()=>{'use strict';const steps=[["live",0,"source/video-live.html","frame"],["recording",8,"source/video-recording.html","frame"],["review",14,"states/video-review-ready.png","image"],["applying",22,"states/video-applying-look.png","image"],["sealed",30,"states/video-sealed.png","image"],["ledger",38,"states/video-ledger.png","image"]],kind="video",params=new URLSearchParams(location.search),delay=Math.max(0,Number(params.get('delay')??5)),duration=46,manual=params.has('manual'),paused=params.has('pause');let epoch=0,active=-1,fixed=Number(params.get('at')||0);const stage=document.getElementById('stage');
function fit(){stage.style.transform='scale('+innerWidth/402+','+innerHeight/714+')'}addEventListener('resize',fit);if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();
function tickFrame(f,t){try{const d=f.contentDocument;if(!d)return;for(const v of d.querySelectorAll('video')){v.muted=true;v.defaultMuted=true;v.playsInline=true;if(v.paused)v.play().catch(()=>{});}if(kind==='video'&&active===1){const e=d.querySelector('[data-testid="video-recording"]');if(e){const text=[...e.querySelectorAll('*')].find(n=>!n.children.length&&/0:\d\d \/ 0:15/.test(n.textContent));if(text)text.textContent='0:'+String(Math.min(6,Math.floor(t-8))).padStart(2,'0')+' / 0:15';}}}catch{}}
function show(t){t=Math.max(0,Math.min(duration,t));let n=0;for(let i=0;i<steps.length;i++)if(t>=steps[i][1])n=i;if(n!==active){document.querySelectorAll('.state').forEach((e,i)=>e.classList.toggle('active',i===n));active=n;document.body.dataset.state=steps[n][0];document.getElementById('seal-hotspot').style.display=n===2?'block':'none';const frame=document.getElementById('state-'+n);if(frame.tagName==='IFRAME'){try{frame.contentDocument.querySelectorAll('video').forEach(v=>{v.currentTime=0;});}catch{}}if(kind==='photo'&&n===2&&!paused){const flash=document.getElementById('flash');flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');}}const frame=document.getElementById('state-'+active);if(frame.tagName==='IFRAME')tickFrame(frame,t);window.rewindTime=t;}
function seek(t){fixed=Number(t);epoch=performance.now()-fixed*1000-delay*1000;show(fixed)}window.rewindSeek=seek;window.rewindDuration=duration;window.rewindReady=false;
const ready=[...document.querySelectorAll('img,iframe')].map(e=>e.tagName==='IMG'?(e.complete?Promise.resolve():new Promise(r=>{e.onload=r;e.onerror=r;})):new Promise(r=>{if(e.contentDocument&&e.contentDocument.readyState==='complete')r();else{e.addEventListener('load',r,{once:true});setTimeout(r,6000);}}));
Promise.all(ready).then(()=>{epoch=performance.now()-fixed*1000;window.rewindReady=true;show(fixed);function loop(){if(!paused&&!manual)show((performance.now()-epoch)/1000-delay);requestAnimationFrame(loop)}requestAnimationFrame(loop);});
function advance(){const next=Math.min(steps.length-1,active+1);seek(steps[next][1]);}document.getElementById('seal-hotspot').addEventListener('click',advance);addEventListener('keydown',e=>{if(e.key==='ArrowRight')advance();if(e.key==='r')location.reload();});
for(const f of document.querySelectorAll('iframe'))f.addEventListener('load',()=>{try{f.contentDocument.addEventListener('click',e=>{const a=e.target.closest('[data-testid="camera-capture"],[data-testid="video-record"],[role="radio"]');if(a)advance();});}catch{}});
})();
</script></body></html>
