<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Rewind</title><style>
html,body{margin:0;padding:0;overflow:hidden;background:#f6ede3;-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif}#stage{position:fixed;left:0;top:0;width:402px;height:714px;transform-origin:0 0;overflow:hidden}#home{width:402px;height:714px;display:block;object-fit:fill}#banner{position:absolute;top:8px;left:8px;right:8px;display:flex;align-items:center;gap:11px;padding:14px 13px 15px 12px;min-height:65px;box-sizing:border-box;border-radius:26px;background:rgba(243,241,239,.92);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 22px rgba(0,0,0,.16);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);transform:translateY(-140px);opacity:0;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .3s}#banner.visible{transform:translateY(0);opacity:1}.icon{width:38px;height:38px;border-radius:9px;flex:none;align-self:center}.copy{flex:1;min-width:0}.meta{font-size:12px;line-height:16px;color:#69645f;margin-bottom:2px;display:flex;justify-content:space-between}.title{font-size:14px;font-weight:600;line-height:18px;color:#171615;letter-spacing:-.15px}.body{font-size:14px;line-height:18px;color:#171615;letter-spacing:-.15px}
</style></head><body><main id="stage"><img id="home" src="states/home-safe.png" alt="Rewind Home"><aside id="banner" aria-label="Rewind notification"><img class="icon" src="assets/rewind-icon-192.png" alt=""><div class="copy"><div class="meta"><span>Rewind</span><span>now</span></div><div class="title">A small moment is waiting</div><div class="body">Share something with your people.</div></div></aside></main><script>
(()=>{const q=new URLSearchParams(location.search),s=document.getElementById('stage'),b=document.getElementById('banner');function fit(){s.style.transform='scale('+innerWidth/402+','+innerHeight/714+')'}fit();addEventListener('resize',fit);if(visualViewport)visualViewport.addEventListener('resize',fit);if(q.has('bg'))document.getElementById('home').src=q.get('bg');const delay=Math.max(0,Number(q.get('delay')??5));window.rewindReady=true;window.rewindDuration=18;window.rewindSeek=t=>b.classList.toggle('visible',t>=delay&&t<delay+10);if(q.has('pause'))window.rewindSeek(Number(q.get('at')||6));else{setTimeout(()=>b.classList.add('visible'),delay*1000);setTimeout(()=>b.classList.remove('visible'),(delay+10)*1000);}document.body.addEventListener('click',()=>b.classList.toggle('visible'));})();
</script></body></html>
